
name: Build KENO V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found in ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KENO-V2-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
